name: Backend CI

on:
  # Le déclencheur sur pull_request est ce qui rend cette CI protectrice.
  
  pull_request:
    branches: [main]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:

    environment: dev

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Check dependencies
        working-directory: backend
        run: npm ls

      # ── Contrôles de la documentation ──
      

      - name: Valider la spécification OpenAPI
        working-directory: backend
        run: npm run docs:lint

    
      - name: Vérifier la cohérence documentation / routes
        working-directory: backend
        run: npm run docs:check

      - name: Build Docker image
        run: |
          docker build \
            -f Dockerfile \
            -t backend-test \
            .